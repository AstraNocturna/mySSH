name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # 版本与组件取自仓库根 rust-toolchain.toml（本机与 CI 同一版本）
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # tauri.conf.json 的 frontendDist 指向 app/ui/dist，cargo 编译 app 前必须先产出前端
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - run: npm ci --prefix app/ui && npm run build --prefix app/ui
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  app-release:
    # 验证 release 产物自包含（custom-protocol 内嵌资源，不依赖 devUrl）
    runs-on: windows-latest
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v4
      # 版本与组件取自仓库根 rust-toolchain.toml（本机与 CI 同一版本）
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - run: npm ci --prefix app/ui && npm run build --prefix app/ui
      - name: build app (release)
        run: cargo build --release -p app
      - name: build cli (release)
        run: cargo build --release -p cli
      - uses: actions/upload-artifact@v4
        with:
          name: myssh-bin
          path: |
            target/release/app.exe
            target/release/myssh-cli.exe
          retention-days: 7
